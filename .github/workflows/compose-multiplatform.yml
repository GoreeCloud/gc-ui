name: GC UI Compose Multiplatform
on:
  pull_request:
    paths:
      - "compose-multiplatform/**"
      - "android/material3-expressive/**"
      - "tokens/gc.tokens.json"
      - "scripts/generate-compose-tokens.mjs"
      - "tests/compose-multiplatform-contract.test.js"
      - ".github/workflows/compose-multiplatform.yml"
  push:
    branches: [main]
    paths:
      - "compose-multiplatform/**"
      - "android/material3-expressive/**"
      - "tokens/gc.tokens.json"
      - "scripts/generate-compose-tokens.mjs"
      - "tests/compose-multiplatform-contract.test.js"
      - ".github/workflows/compose-multiplatform.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node scripts/generate-compose-tokens.mjs --check
      - run: node --test tests/compose-multiplatform-contract.test.js tests/material3-expressive-contract.test.js
  compile-android-kmp:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.4.1"
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1"'
      - name: Check generated tokens
        run: node scripts/generate-compose-tokens.mjs --check
      - name: Compile shared Kotlin Android target
        run: gradle -p compose-multiplatform :gc-ui-compose:assemble --no-daemon --stacktrace
