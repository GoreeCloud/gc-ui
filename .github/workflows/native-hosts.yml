name: GC UI native host quality gates

on:
  push:
    branches: [main]
    paths:
      - 'scripts/qa-android-power-readiness.py'
      - 'scripts/test_qa_android_power_readiness.py'
      - 'scripts/check-desktop-portability.mjs'
      - 'scripts/qa-android-perfetto.py'
      - 'scripts/test_qa_android_perfetto.py'
      - 'scripts/qa-orca-speech.py'
      - 'scripts/test_qa_orca_speech.py'
      - 'native/**'
      - 'scripts/qa-android-performance.py'
      - 'scripts/qa-android-compositor.py'
      - 'scripts/qa-android-gpu.py'
      - 'scripts/test_qa_android_gpu.py'
      - 'scripts/qa-electron-atspi.py'
      - 'scripts/test_qa_electron_atspi.py'
      - 'scripts/test_qa_android_compositor.py'
      - 'scripts/test_qa_android_performance.py'
      - 'src/gc-native-host.mjs'
      - 'src/gc-platform-profile.mjs'
      - 'lab/experience-studio.*'
      - 'styles/gc.v1.materials.css'
      - 'styles/gc.v1.depth.css'
      - 'e2e/native-host.spec.mjs'
      - 'playwright.config.mjs'
      - 'tests/native-*.test.mjs'
      - '.github/workflows/native-hosts.yml'
      - 'package.json'
      - 'types/index.d.ts'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-android-power-readiness.py'
      - 'scripts/test_qa_android_power_readiness.py'
      - 'scripts/check-desktop-portability.mjs'
      - 'scripts/qa-android-perfetto.py'
      - 'scripts/test_qa_android_perfetto.py'
      - 'scripts/qa-orca-speech.py'
      - 'scripts/test_qa_orca_speech.py'
      - 'native/**'
      - 'scripts/qa-android-performance.py'
      - 'scripts/qa-android-compositor.py'
      - 'scripts/qa-android-gpu.py'
      - 'scripts/test_qa_android_gpu.py'
      - 'scripts/qa-electron-atspi.py'
      - 'scripts/test_qa_electron_atspi.py'
      - 'scripts/test_qa_android_compositor.py'
      - 'scripts/test_qa_android_performance.py'
      - 'src/gc-native-host.mjs'
      - 'src/gc-platform-profile.mjs'
      - 'lab/experience-studio.*'
      - 'styles/gc.v1.materials.css'
      - 'styles/gc.v1.depth.css'
      - 'e2e/native-host.spec.mjs'
      - 'playwright.config.mjs'
      - 'tests/native-*.test.mjs'
      - '.github/workflows/native-hosts.yml'
      - 'package.json'
      - 'types/index.d.ts'

permissions:
  contents: read

jobs:
  native-contracts:
    name: Versioned host protocol and local resource safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native bridge and deny-by-default policies
        run: npm run test:native:contracts
      - name: Verify device performance report parser without an Android device
        run: npm run test:android:performance:parsers
      - name: Verify SurfaceFlinger presentation timestamp parser
        run: npm run test:android:compositor:parsers
      - name: Verify HWUI GPU histogram parsing
        run: npm run test:android:gpu:parsers
      - name: Verify desktop AT-SPI role/name policy parsing
        run: npm run test:desktop:atspi:parsers
      - name: Verify GC UI Perfetto trace metric parser
        run: npm run test:android:perfetto:parsers
      - name: Verify Orca generated-speech event parser
        run: npm run test:desktop:orca:parsers
      - name: Verify Android physical-device and disconnected-power fail-closed preflight
        run: npm run test:android:power-readiness:parsers

  android-debug:
    name: Compile isolated GC UI Android preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install matching Android platform and build tools
        # Hosted Ubuntu already contains SDK command-line tools.
        # The removed action requested the obsolete Android SDK tools package.
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK from tracked sources and checked-in Gradle wrapper
        working-directory: native/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Inspect the compiled APK exists
        run: test -s native/android/app/build/outputs/apk/debug/app-debug.apk

  desktop-native:
    name: Launch pinned sandboxed GC UI Electron host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked optional Electron desktop runtime
        run: npm ci --prefix native/desktop --no-audit --no-fund
      - name: Verify actual native desktop launch, profile and appearance
        run: npm run qa:native:desktop

  desktop-portability:
    name: "Pinned Electron and keyboard/semantics — ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned optional Electron runtime
        run: npm ci --prefix native/desktop --no-audit --no-fund
      - name: Validate localized desktop resources and locked versions
        run: npm run qa:desktop:portability
      - name: Enforce host protocols and deny-by-default local resource checks
        run: npm run test:native:contracts
      - name: Launch Electron desktop preview and verify keyboard and accessible roles
        run: npm run qa:native:desktop:direct
