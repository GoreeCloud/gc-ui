name: GC UI Compose iOS source compile
on:
  pull_request:
    paths:
      - "compose-multiplatform/**"
      - "tokens/gc.tokens.json"
      - "scripts/generate-compose-tokens.mjs"
      - "tests/compose-ios-contract.test.js"
      - ".github/workflows/compose-ios.yml"
  push:
    branches: [main]
    paths:
      - "compose-multiplatform/**"
      - "tokens/gc.tokens.json"
      - "scripts/generate-compose-tokens.mjs"
      - "tests/compose-ios-contract.test.js"
      - ".github/workflows/compose-ios.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-ios-simulator:
    runs-on: macos-15-arm64
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.4.1"
      - name: Verify original tokens and declared iOS source targets
        run: |
          node scripts/generate-compose-tokens.mjs --check
          node --test tests/compose-ios-contract.test.js
      - name: Inspect native host configuration
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          test -d "$ANDROID_HOME/platforms/android-37.1"
      - name: Compile first-party Compose source for iOS Simulator ARM64
        run: |
          gradle -p compose-multiplatform :gc-ui-compose:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace
      - name: Record native compile result without claiming runtime acceptance
        run: echo "iOS simulator ARM64 source compilation passed; no iOS app, device test or signing performed"
