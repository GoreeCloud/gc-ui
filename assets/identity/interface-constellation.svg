<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">GoreeCloud UI original interface constellation artwork candidate</title>
<desc id="desc">Three layered floating interface surfaces form an orbital composition against a calm night-sky field, representing Canvas, Surface, and Lens.</desc>
