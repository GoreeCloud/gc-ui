name: GC UI Android Compose source interop
on:
  pull_request:
    paths:
      - "samples/android-compose-integration/**"
      - "compose-multiplatform/**"
      - "android/material3-expressive/**"
      - "tokens/gc.tokens.json"
      - "scripts/generate-compose-tokens.mjs"
      - "tests/compose-interop-contract.test.js"
      - ".github/workflows/compose-interop.yml"
  push:
    branches: [main]
    paths:
      - "samples/android-compose-integration/**"
      - "compose-multiplatform/**"
      - "android/material3-expressive/**"
      - "tokens/gc.tokens.json"
      - "scripts/generate-compose-tokens.mjs"
      - "tests/compose-interop-contract.test.js"
      - ".github/workflows/compose-interop.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-interop-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node scripts/generate-compose-tokens.mjs --check
      - run: node --test tests/compose-interop-contract.test.js
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.4.1"
      - name: Install pinned Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1"'
      - name: Compile actual shared Compose plus Android Expressive sources into APK
        run: gradle -p samples/android-compose-integration :app:assembleDebug --no-daemon --stacktrace
      - name: Verify development-only APK exists and record SHA256
        run: |
          apk="samples/android-compose-integration/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk"
