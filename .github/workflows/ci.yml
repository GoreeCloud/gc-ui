name: GC UI quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    name: Tokens, color, interactions, and reference integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generated tokens and run tests
        run: npm run check
      - name: Verify the Foundations release candidate using an offline consumer install
        run: npm run release:foundations:verify
      - name: Typecheck the installed Foundations tarball with pinned TypeScript
        run: npm run release:foundations:types
      - name: Verify unpublished web-controls Seal qualification archive
        run: npm run release:seal:web:verify
      - name: Typecheck installed web-controls candidate with pinned TypeScript
        run: npm run release:seal:web:types
      - name: Retain unsigned Seal qualification artifact for review (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: gc-ui-seal-web-candidate-qa
          path: |
            dist/seal-web-verify/goreecloud-gc-ui-0.2.0-seal.0.tgz
            dist/seal-web-verify/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
      - name: Attach unsigned Foundations candidate tarball (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: gc-ui-foundations-v1-rc1-qa
          path: |
            dist/foundations-verify/goreecloud-gc-ui-1.0.0-rc.1.tgz
            dist/foundations-verify/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
      - name: Check source module syntax
        run: |
          node --check src/main.js
          node --check src/gc-color-engine.mjs
          node --check src/gc-theme-runtime.mjs
          node --check src/gc-interactions.mjs
          node --check src/gc-menu.mjs
          node --check src/gc-form-controls.mjs
          node --check lab/v1.js
          node --check lab/primitives.mjs
          node --check lab/catalog.mjs
          node --check lab/adaptive.mjs
          node --check lab/forms.mjs
          node --check playwright.config.mjs
          node --check e2e/gc-ui.spec.mjs
          node --check e2e/foundations-packaged.spec.mjs
          node --check e2e/visual-capture.spec.mjs
          node --check e2e/adaptive.spec.mjs
          node --check e2e/adaptive-visual.spec.mjs
          node --check e2e/accessibility.spec.mjs
          node --check e2e/forms.spec.mjs
          node --check e2e/reflow.spec.mjs
          node --check e2e/effective-zoom.spec.mjs
          node --check e2e/forms-visual.spec.mjs
          node --check scripts/build-v1-tokens.mjs
          node --check scripts/audit-colors.mjs
          node --check scripts/check-pack-manifest.mjs
          node --check scripts/audit-legacy-consumer.mjs
          node --check scripts/check-consumer-reconciliation.mjs
          node --check scripts/build-foundations-candidate.mjs
          node --check scripts/verify-foundations-candidate.mjs
          node --check scripts/qa-real-browser-zoom.mjs
          python3 -c "import ast,pathlib;ast.parse(pathlib.Path('scripts/qa-x11-zoom.py').read_text())"
          node --check src/index.mjs
      - name: Resolve reference lab local assets
        run: node tests/check-lab-references.mjs

  browser-smoke:
    name: Browser interaction smoke tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1 axe-core@4.10.3
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install Foundations fixture from tarball
        run: npm run release:foundations:verify
      - name: Test responsive browser behaviors
        run: npm run test:e2e
      - name: Verify all 21 actual-build full-page visual evidence files
        run: npm run qa:visual-evidence:verify
      - name: Verify genuine 200% and 400% Chromium browser zoom
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-utils libxtst6
          npm run qa:native-zoom:chromium
      - name: Upload visual captures and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-ui-browser-qa-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  browser-firefox:
    name: Firefox interaction smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1
      - name: Install Firefox browser and dependencies
        run: npx playwright install --with-deps firefox
      - name: Install Foundations fixture from tarball
        run: npm run release:foundations:verify
      - name: Verify keyboard, theme and adaptive navigation in Firefox
        run: npm run test:e2e:firefox
      - name: Verify genuine 200% and 400% Firefox browser zoom
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-utils libxtst6
          npm run qa:native-zoom:firefox
      - name: Upload Firefox browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-ui-firefox-qa-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  foundations-stable:
    name: Stable Foundations archive, types and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Apache-2.0 Foundations stable distribution archive
        run: npm run release:foundations:stable:verify
      - name: Compile installed stable distribution consumer types
        run: npm run release:foundations:types
      - name: Retain unsigned stable build candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: gc-ui-foundations-v1-stable-qa
          path: |
            dist/foundations-verify/goreecloud-gc-ui-1.0.1.tgz
            dist/foundations-verify/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
      - name: Install pinned Playwright browser contract runner
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Test installed stable tarball in Chromium
        run: GC_FOUNDATIONS_VERSION=1.0.1 npx playwright test e2e/foundations-packaged.spec.mjs --browser chromium
      - name: Test installed stable tarball in Firefox
        run: GC_FOUNDATIONS_VERSION=1.0.1 npx playwright test e2e/foundations-packaged.spec.mjs --browser firefox
