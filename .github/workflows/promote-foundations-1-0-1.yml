name: Publish reviewed Foundations 1.0.1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundations-1-0-1-promotion
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact source and successful acceptance run
        run: |
          set -eu
          source_sha="$(gh api repos/GoreeCloud/gc-ui/actions/runs/39139538419 --jq '.head_sha')"
          conclusion="$(gh api repos/GoreeCloud/gc-ui/actions/runs/39139538419 --jq '.conclusion')"
          test "$source_sha" = "7e0b61ee70af2edb87aa736cca483425f0aacaf4"
          test "$conclusion" = "success"
          if gh api repos/GoreeCloud/gc-ui/git/ref/tags/foundations-v1.0.1 >/dev/null 2>&1; then
            echo "Tag already exists; refusing to replace a release"
            exit 1
          fi
      - name: Download exact reviewed archive from passed Actions run
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          gh run download 39139538419 -R GoreeCloud/gc-ui -n gc-ui-foundations-v1-stable-qa -D "$RUNNER_TEMP/package"
      - name: Verify checksum, version, license and provenance
        run: |
          set -eu
          cd "$RUNNER_TEMP/package"
          printf '%s  %s\n' "275d7e6dc9503b2e74b3190bcecf176d73d2345860e8a20fa5faa3b326cd2298" "goreecloud-gc-ui-1.0.1.tgz" | sha256sum -c -
          sha256sum -c SHA256SUMS
          test "$(tar -xOzf goreecloud-gc-ui-1.0.1.tgz package/package.json | jq -r '.version')" = "1.0.1"
          test "$(tar -xOzf goreecloud-gc-ui-1.0.1.tgz package/package.json | jq -r '.license')" = "Apache-2.0"
          test "$(tar -xOzf goreecloud-gc-ui-1.0.1.tgz package/provenance.json | jq -r '.releaseVersion')" = "1.0.1"
      - name: Prepare patch notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          # GoreeCloud UI Foundations 1.0.1
          
          Stable Apache-2.0 maintenance release for the supported semantic-token, color-engine and browser theme-controller package.
          
          Fixes external CSS priority ownership: destroying a custom-accent theme controller no longer overwrites a consuming application's later `!important` declaration when only priority changed. Includes Node, Chromium and Firefox regressions.
          
          **Exact reviewed source:** `7e0b61ee70af2edb87aa736cca483425f0aacaf4`. [All post-merge CI gates passed](https://github.com/GoreeCloud/gc-ui/actions/runs/39139538419).
          
          Download `goreecloud-gc-ui-1.0.1.tgz` and `SHA256SUMS`; verify SHA-256 and install with `npm install ./goreecloud-gc-ui-1.0.1.tgz`. Expected tarball digest: `275d7e6dc9503b2e74b3190bcecf176d73d2345860e8a20fa5faa3b326cd2298`.
          
          This release is a stable Foundations-only npm-format archive **distributed by GitHub**, not a claim of publication to npmjs.org or whole-workspace stability. The experimental root UI, native previews and Glaze migration remain separately gated. v1.0.0 release bytes remain immutable.
          NOTES
      - name: Stage draft release with exact candidate bytes
        run: |
          gh release create foundations-v1.0.1 -R GoreeCloud/gc-ui --draft --title "GoreeCloud UI Foundations v1.0.1" --target 7e0b61ee70af2edb87aa736cca483425f0aacaf4 --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/package/goreecloud-gc-ui-1.0.1.tgz" "$RUNNER_TEMP/package/SHA256SUMS"
      - name: Independently download draft assets before publishing
        run: |
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download foundations-v1.0.1 -R GoreeCloud/gc-ui -D "$RUNNER_TEMP/readback"
          cd "$RUNNER_TEMP/readback"
          sha256sum -c SHA256SUMS
          printf '%s  %s\n' "275d7e6dc9503b2e74b3190bcecf176d73d2345860e8a20fa5faa3b326cd2298" "goreecloud-gc-ui-1.0.1.tgz" | sha256sum -c -
      - name: Publish checked release
        run: |
          gh release edit foundations-v1.0.1 -R GoreeCloud/gc-ui --draft=false
          test "$(gh api repos/GoreeCloud/gc-ui/releases/tags/foundations-v1.0.1 --jq '.draft')" = "false"
