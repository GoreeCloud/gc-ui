 <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(990 460) rotate(90) scale(500 560)" gradientUnits="userSpaceOnUse"><stop stop-color="#665DFF" stop-opacity=".28"/><stop offset="1" stop-color="#665DFF" stop-opacity="0"/></radialGradient>
 </defs>
